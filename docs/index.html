<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tommie Baseball Stats · TAPbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:           #080c14;
      --surface:      #0f1623;
      --surface-2:    #161f30;
      --surface-3:    #1d2840;
      --border:       #1e2d47;
      --border-light: #2a3d5c;

      --ust-purple:   #4f2d7f;
      --ust-violet:   #7c3aed;
      --ust-glow:     rgba(124, 58, 237, 0.22);

      /* Medal Tones */
      --gold:         #fbbf24;
      --gold-bg:      rgba(251, 191, 36, 0.12);
      --gold-border:  rgba(251, 191, 36, 0.35);

      --silver:       #e2e8f0;
      --silver-bg:    rgba(226, 232, 240, 0.12);
      --silver-border:rgba(226, 232, 240, 0.35);

      --bronze:       #f97316;
      --bronze-bg:    rgba(249, 115, 22, 0.12);
      --bronze-border:rgba(249, 115, 22, 0.35);

      --text:         #e8edf5;
      --text-muted:   #7a8fa8;
      --text-faint:   #3d5068;

      --green:        #10b981;
      --red:          #ef4444;

      --radius:       12px;
      --radius-sm:    6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .wordmark-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ust-violet);
      font-family: 'JetBrains Mono', monospace;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #c4b5fd 0%, #8b5cf6 50%, #6d28d9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      text-align: right;
    }

    .meta a {
      color: var(--ust-violet);
      text-decoration: none;
    }

    .meta a:hover { text-decoration: underline; }

    /* ── Search Spotlight ────────────────────────────────────────────────────── */
    .search-section {
      margin-bottom: 2rem;
    }

    .search-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      display: block;
    }

    .search-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      font-size: 1.1rem;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
    }

    #playerSearch {
      background: var(--surface-2);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      width: 120px;
      padding: 0.5rem 0.75rem 0.5rem 2.2rem;
      text-align: center;
      transition: all 0.2s;
      outline: none;
    }

    #playerSearch:focus {
      border-color: var(--ust-violet);
      box-shadow: 0 0 0 3px var(--ust-glow);
    }

    .search-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .not-found {
      display: none;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius-sm);
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      color: #f87171;
      margin-bottom: 1.5rem;
    }

    /* ── Spotlight Card ──────────────────────────────────────────────────────── */
    #spotlightCard {
      display: none;
      background: var(--surface);
      border: 1.5px solid var(--ust-violet);
      border-radius: var(--radius);
      box-shadow: 0 0 35px var(--ust-glow), 0 8px 32px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-bottom: 2.5rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .spotlight-header {
      background: linear-gradient(135deg, var(--ust-purple) 0%, #1e1138 100%);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .jersey-badge {
      background: var(--ust-violet);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 800;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
    }

    .spotlight-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .spotlight-sub {
      font-size: 0.82rem;
      color: #c4b5fd;
      margin-top: 0.2rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.85rem 1.5rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 1px;
      background: var(--border);
    }

    .stat-cell {
      background: var(--surface);
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      position: relative;
      transition: background 0.15s;
    }

    .stat-cell:hover { background: var(--surface-2); }

    .stat-key {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Top 3 Medal Styling ─────────────────────────────────────────────────── */
    .stat-cell.rank-1 {
      background: var(--gold-bg);
      border-bottom: 2px solid var(--gold);
    }
    .stat-cell.rank-1 .stat-val { color: var(--gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.35); }

    .stat-cell.rank-2 {
      background: var(--silver-bg);
      border-bottom: 2px solid var(--silver);
    }
    .stat-cell.rank-2 .stat-val { color: var(--silver); text-shadow: 0 0 10px rgba(226, 232, 240, 0.3); }

    .stat-cell.rank-3 {
      background: var(--bronze-bg);
      border-bottom: 2px solid var(--bronze);
    }
    .stat-cell.rank-3 .stat-val { color: var(--bronze); text-shadow: 0 0 10px rgba(249, 115, 22, 0.3); }

    .rank-tag {
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 800;
    }
    .rank-1 .rank-tag { background: var(--gold); color: #000; }
    .rank-2 .rank-tag { background: var(--silver); color: #000; }
    .rank-3 .rank-tag { background: var(--bronze); color: #000; }

    /* ── Tabs ────────────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn:hover { border-color: var(--ust-violet); color: var(--text); }

    .tab-btn.active {
      background: var(--ust-violet);
      border-color: var(--ust-violet);
      color: #fff;
    }

    /* ── Full Table ──────────────────────────────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-card-header {
      background: var(--surface-2);
      padding: 0.85rem 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .table-card-title {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead th {
      background: rgba(0,0,0,0.3);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    thead th:first-child,
    thead th:nth-child(2) { text-align: left; cursor: default; }

    thead th:hover:not(:first-child):not(:nth-child(2)) {
      color: var(--text);
      background: rgba(124, 58, 237, 0.15);
    }

    thead th.sorted { color: #c4b5fd; }

    tbody td {
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text);
      white-space: nowrap;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    tbody td:first-child,
    tbody td:nth-child(2) {
      text-align: left;
      font-family: 'Inter', sans-serif;
    }

    tbody td:first-child {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      width: 48px;
    }

    tbody td:nth-child(2) { font-weight: 600; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.025); }

    tbody tr.row-highlight td {
      background: var(--ust-glow) !important;
    }

    tbody tr.row-highlight td:first-child { color: #c4b5fd; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    .status-dot.error { background: var(--red); }

    .empty {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header>
    <div class="wordmark">
      <span class="wordmark-eyebrow">TAPbot · 2026 Season</span>
      <h1>Tommie Baseball Stats</h1>
    </div>
    <div class="meta" id="metaBar">Loading data…</div>
  </header>

  <!-- Player Search -->
  <section class="search-section">
    <label class="search-label" for="playerSearch">Search by Jersey Number</label>
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="search-icon">#</span>
        <input
          id="playerSearch"
          type="number"
          min="0"
          max="99"
          placeholder="00"
          autocomplete="off"
          aria-label="Player jersey number"
        />
      </div>
      <span class="search-hint">Enter a jersey number to view player stat cards and Top 3 highlights (🥇 🥈 🥉).</span>
    </div>
  </section>

  <!-- Not Found Banner -->
  <div class="not-found" id="notFound">
    No player found with that jersey number.
  </div>

  <!-- Spotlight Card (Search result) -->
  <div id="spotlightCard">
    <div class="spotlight-header">
      <div class="jersey-badge" id="spotJersey">—</div>
      <div>
        <div class="spotlight-name" id="spotName">—</div>
        <div class="spotlight-sub" id="spotSub">University of St. Thomas Baseball</div>
      </div>
    </div>

    <!-- Batting Section -->
    <div id="spotHittingSection">
      <div class="stat-section-title">⚾ Batting Stats</div>
      <div class="stat-grid" id="spotHittingGrid"></div>
    </div>

    <!-- Pitching Section -->
    <div id="spotPitchingSection">
      <div class="stat-section-title">⚡ Pitching Stats</div>
      <div class="stat-grid" id="spotPitchingGrid"></div>
    </div>
  </div>

  <!-- Full Roster Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('batting', this)">Batting</button>
    <button class="tab-btn" onclick="switchTab('pitching', this)">Pitching</button>
  </div>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-card-header">
      <span class="table-card-title" id="tableTitle">Batting Stats — Full Roster</span>
      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready</span>
      </div>
    </div>
    <div class="table-wrap">
      <table id="statsTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td colspan="15" class="empty">Loading stats…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let RAW_DATA = null;
  let BATTING_PLAYERS = [];
  let PITCHING_PLAYERS = [];
  let activeTab = 'batting';
  let sortCol   = null;
  let sortDir   = 1;
  let searchNum = '';

  const BATTING_KEYS = [
    { key: 'AVG',  label: 'AVG' },
    { key: 'R',    label: 'R' },
    { key: 'H',    label: 'H' },
    { key: '2B',   label: '2B' },
    { key: '3B',   label: '3B' },
    { key: 'HR',   label: 'HR' },
    { key: 'RBI',  label: 'RBI' },
    { key: 'OPS',  label: 'OPS' },
    { key: 'SLG%', label: 'SLG%' }
  ];

  const PITCHING_KEYS = [
    { key: 'ERA',  label: 'ERA',  lowerIsBetter: true },
    { key: 'WHIP', label: 'WHIP', lowerIsBetter: true },
    { key: 'W-L',  label: 'W-L' },
    { key: 'IP',   label: 'IP' },
    { key: 'SO',   label: 'SO' }
  ];

  function parseStat(val, key) {
    if (val === undefined || val === null || val === '-' || val === '') return -999999;
    if (key === 'W-L') {
      const parts = String(val).split('-');
      return parseFloat(parts[0]) || 0;
    }
    return parseFloat(val) || 0;
  }

  let RANKS = { batting: {}, pitching: {} };

  function calculateRanks() {
    RANKS = { batting: {}, pitching: {} };

    // Batting
    BATTING_KEYS.forEach(k => {
      const vals = BATTING_PLAYERS
        .map(p => parseStat(p[k.key], k.key))
        .filter(v => v !== -999999);
      
      const distinct = [...new Set(vals)].sort((a, b) => b - a);
      RANKS.batting[k.key] = {
        1: distinct[0],
        2: distinct[1],
        3: distinct[2]
      };
    });

    // Pitching
    PITCHING_KEYS.forEach(k => {
      const vals = PITCHING_PLAYERS
        .map(p => parseStat(p[k.key], k.key))
        .filter(v => v !== -999999 && v > 0);

      const distinct = [...new Set(vals)].sort((a, b) => k.lowerIsBetter ? a - b : b - a);
      RANKS.pitching[k.key] = {
        1: distinct[0],
        2: distinct[1],
        3: distinct[2]
      };
    });
  }

  function getRank(type, key, val) {
    const num = parseStat(val, key);
    if (num === -999999 || (key === 'ERA' && num <= 0)) return null;
    const r = RANKS[type]?.[key];
    if (!r) return null;
    if (num === r[1]) return 1;
    if (num === r[2]) return 2;
    if (num === r[3]) return 3;
    return null;
  }

  // ── Fetch & Parse baseball_stats.json ───────────────────────────────────────
  async function loadData() {
    try {
      const res = await fetch('baseball_stats.json?t=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      RAW_DATA = await res.json();
      
      // Adapt to both flat arrays or categorized schema in baseball_stats.json
      if (RAW_DATA.hitting || RAW_DATA.pitching) {
        BATTING_PLAYERS = RAW_DATA.hitting || [];
        PITCHING_PLAYERS = RAW_DATA.pitching || [];
      } else if (Array.isArray(RAW_DATA)) {
        BATTING_PLAYERS = RAW_DATA
          .filter(p => p.batting_stats)
          .map(p => ({ number: String(p.jersey_number), player: p.player_name, ...p.batting_stats }));
        PITCHING_PLAYERS = RAW_DATA
          .filter(p => p.pitching_stats)
          .map(p => ({ number: String(p.jersey_number), player: p.player_name, ...p.pitching_stats }));
      }

      calculateRanks();

      const updatedTime = RAW_DATA.generated_at ? new Date(RAW_DATA.generated_at).toLocaleString() : 'Live';
      document.getElementById('metaBar').innerHTML =
        `Updated: ${updatedTime} · <a href="baseball_stats.json" target="_blank">baseball_stats.json ↗</a>`;
      
      renderTable();
    } catch (err) {
      document.getElementById('statusDot').className = 'status-dot error';
      document.getElementById('statusText').textContent = 'Error';
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="15" class="empty" style="color:#f87171">
          Failed to load baseball_stats.json — make sure the scraper has run.<br>
          <small style="color:var(--text-muted)">${err.message}</small>
        </td></tr>`;
      document.getElementById('metaBar').textContent = 'Error loading baseball_stats.json';
    }
  }

  // ── Tab Switch ─────────────────────────────────────────────────────────────
  function switchTab(tab, btn) {
    activeTab = tab;
    sortCol = null;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tableTitle').textContent =
      tab === 'batting' ? 'Batting Stats — Full Roster' : 'Pitching Stats — Full Roster';
    renderTable();
    if (searchNum) highlightRow(searchNum);
  }

  // ── Render Full Table ──────────────────────────────────────────────────────
  function renderTable() {
    const isBatting = activeTab === 'batting';
    const rows = isBatting ? BATTING_PLAYERS : PITCHING_PLAYERS;
    const cols = isBatting ? BATTING_KEYS : PITCHING_KEYS;

    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');

    // Header
    head.innerHTML = `<tr>
      <th>#</th>
      <th>Player</th>
      ${cols.map(c => `
        <th onclick="sortBy('${c.key}')" class="${sortCol === c.key ? 'sorted' : ''}">
          ${c.label}${sortCol === c.key ? (sortDir === 1 ? ' ↑' : ' ↓') : ''}
        </th>
      `).join('')}
    </tr>`;

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="${cols.length + 2}" class="empty">No ${activeTab} data found.</td></tr>`;
      return;
    }

    let sorted = [...rows];
    if (sortCol) {
      sorted.sort((a, b) => {
        const av = parseStat(a[sortCol], sortCol);
        const bv = parseStat(b[sortCol], sortCol);
        return (av - bv) * sortDir;
      });
    }

    body.innerHTML = sorted.map(r => {
      const isHL = String(r.number) === String(searchNum);
      return `<tr class="${isHL ? 'row-highlight' : ''}" data-num="${r.number}">
        <td>${r.number}</td>
        <td>${esc(r.player)}</td>
        ${cols.map(c => `<td>${r[c.key] || '—'}</td>`).join('')}
      </tr>`;
    }).join('');
  }

  // ── Sorting ────────────────────────────────────────────────────────────────
  function sortBy(col) {
    if (sortCol === col) {
      sortDir *= -1;
    } else {
      sortCol = col;
      sortDir = (col === 'ERA' || col === 'WHIP') ? 1 : -1;
    }
    renderTable();
    if (searchNum) highlightRow(searchNum);
  }

  // ── Spotlight Search & Top 3 Highlighting ──────────────────────────────────
  document.getElementById('playerSearch').addEventListener('input', function () {
    searchNum = this.value.trim();
    const notFound = document.getElementById('notFound');
    const card     = document.getElementById('spotlightCard');

    if (!searchNum) {
      card.style.display = 'none';
      notFound.style.display = 'none';
      highlightRow('');
      return;
    }

    // Look up across both hitting and pitching tables
    const hittingPlayer = BATTING_PLAYERS.find(p => String(p.number) === searchNum);
    const pitchingPlayer = PITCHING_PLAYERS.find(p => String(p.number) === searchNum);

    if (!hittingPlayer && !pitchingPlayer) {
      card.style.display = 'none';
      notFound.style.display = 'block';
      highlightRow('');
      return;
    }

    notFound.style.display = 'none';
    card.style.display     = 'block';

    const playerName = (hittingPlayer || pitchingPlayer).player || '—';
    document.getElementById('spotJersey').textContent = `#${searchNum}`;
    document.getElementById('spotName').textContent   = playerName;

    // Batting Card
    const hSection = document.getElementById('spotHittingSection');
    const hGrid    = document.getElementById('spotHittingGrid');
    if (hittingPlayer) {
      hSection.style.display = 'block';
      hGrid.innerHTML = BATTING_KEYS.map(c => {
        const val = hittingPlayer[c.key] || '—';
        const rank = getRank('batting', c.key, val);
        const rankClass = rank ? `rank-${rank}` : '';
        const rankBadge = rank ? `<span class="rank-tag">${rank === 1 ? '1st' : rank === 2 ? '2nd' : '3rd'}</span>` : '';

        return `<div class="stat-cell ${rankClass}">
          <span class="stat-key">${c.label} ${rankBadge}</span>
          <span class="stat-val">${val}</span>
        </div>`;
      }).join('');
    } else {
      hSection.style.display = 'none';
    }

    // Pitching Card
    const pSection = document.getElementById('spotPitchingSection');
    const pGrid    = document.getElementById('spotPitchingGrid');
    if (pitchingPlayer) {
      pSection.style.display = 'block';
      pGrid.innerHTML = PITCHING_KEYS.map(c => {
        const val = pitchingPlayer[c.key] || '—';
        const rank = getRank('pitching', c.key, val);
        const rankClass = rank ? `rank-${rank}` : '';
        const rankBadge = rank ? `<span class="rank-tag">${rank === 1 ? '1st' : rank === 2 ? '2nd' : '3rd'}</span>` : '';

        return `<div class="stat-cell ${rankClass}">
          <span class="stat-key">${c.label} ${rankBadge}</span>
          <span class="stat-val">${val}</span>
        </div>`;
      }).join('');
    } else {
      pSection.style.display = 'none';
    }

    highlightRow(searchNum);
  });

  function highlightRow(num) {
    document.querySelectorAll('#tableBody tr').forEach(tr => {
      tr.classList.toggle('row-highlight', tr.dataset.num === String(num));
    });
  }

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  loadData();
</script>

</body>
</html>
