name: Update Baseball Stats

on:
  # ── Manual trigger from the Actions tab ──────────────────────────────────
  workflow_dispatch:

  # ── Scheduled: every morning at 9:00 AM CT (14:00 UTC) ───────────────────
  schedule:
    - cron: "0 14 * * *"

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 3. Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Install Playwright's headless Chromium browser
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # 5. Run the baseball stats scraper
      - name: Scrape Tommie Baseball Stats
        env:
          STATS_URL: "https://tommiesports.com/sports/baseball/stats/2026"
        run: |
          python scraper/scrape_baseball.py \
            --out docs/baseball_stats.json \
            --year 2026

      # 6. Commit updated data.json back to the repo (only if changed)
      - name: Commit updated stats
        run: |
          git config user.name  "TAPbot"
          git config user.email "tapbot@users.noreply.github.com"
          git add docs/baseball_stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit — stats are up to date."
          else
            git commit -m "Update baseball stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # 7. Deploy docs/ to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "Deploy baseball stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          keep_files: true
